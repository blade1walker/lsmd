# The website, automatic HTTPS and the nightly LOA job on any server with
# Docker (Oracle, Hetzner, DigitalOcean, a home server...). From the repo root:
#
#   cp .env.example deploy/docker/.env        # fill it in, and add DOMAIN=your.domain
#   node deploy/check-env.mjs deploy/docker/.env
#   docker compose -f deploy/docker/compose.yml up -d --build
#
# Update after a push:  git pull && docker compose -f deploy/docker/compose.yml up -d --build
# Logs:                 docker compose -f deploy/docker/compose.yml logs -f app
services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file: .env
    # Images uploaded in the Boss Menu; kept across rebuilds.
    volumes:
      - app_data:/app/data
    restart: unless-stopped

  # Gets and renews the HTTPS certificate on its own. The domain's DNS must
  # already point at this server, with ports 80 and 443 open.
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?add DOMAIN=your.domain to deploy/docker/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

  # 08:00 UTC daily, what vercel.json's cron did. The route refuses to run
  # without CRON_SECRET, so this does nothing until that is set.
  cron:
    image: alpine:3.20
    env_file: .env
    command:
      - sh
      - -c
      - >-
        echo "0 8 * * * wget -q -O- --header 'Authorization: Bearer $$CRON_SECRET' http://app:3000/api/cron/loa-expiry"
        > /etc/crontabs/root && exec crond -f -l 8
    depends_on:
      - app
    restart: unless-stopped

  # The Discord bot (bot/). Off unless asked for: copy bot/.env.example to
  # deploy/docker/bot.env, set WEBSITE_URL=http://app:3000 and the token, then
  #   docker compose -f deploy/docker/compose.yml --profile bot up -d --build
  bot:
    profiles: [bot]
    build: ../../bot
    env_file: bot.env
    depends_on:
      - app
    restart: unless-stopped

volumes:
  app_data:
  caddy_data:
  caddy_config:
