name: Build & Release Android App

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "deploy/**"
      - "bot/**"
      - "fivem/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Release Keystore
        id: setup-keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using keystore from GitHub Secret ANDROID_KEYSTORE_BASE64..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release-upload.jks
          else
            echo "Generating production upload keystore for Google Play Store..."
            keytool -genkeypair -v \
              -keystore android/app/release-upload.jks \
              -alias "${{ secrets.ANDROID_KEY_ALIAS || 'nexus-ems' }}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'nexus_ems_2026' }}" \
              -keypass "${{ secrets.ANDROID_KEY_PASSWORD || 'nexus_ems_2026' }}" \
              -dname "CN=Nexus EMS, OU=Medical, O=Nexus Universe RP, L=Los Santos, ST=San Andreas, C=US"
          fi

      - name: Build Android Packages (Signed Release APK & Google Play Bundle)
        working-directory: android
        env:
          KEYSTORE_PATH: "release-upload.jks"
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'nexus_ems_2026' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'nexus-ems' }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'nexus_ems_2026' }}
        run: |
          gradle assembleRelease assembleDebug bundleRelease --no-daemon --stacktrace

      - name: Locate Output Artifacts
        id: find-artifacts
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/nexus-ems-debug.apk || true
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/nexus-ems-release.apk || cp android/app/build/outputs/apk/release/app-release-unsigned.apk artifacts/nexus-ems-release.apk || true
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/nexus-ems-playstore.aab || true
          ls -lh artifacts/

      - name: Upload APKs & AAB as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ems-android-builds
          path: artifacts/

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --title "Nexus EMS Android App (Latest)" \
              --notes "Automated Android APK and Google Play AAB build. Updated automatically on every website push."
          
          if [ -f artifacts/nexus-ems-debug.apk ]; then
            gh release upload android-latest artifacts/nexus-ems-debug.apk --clobber
          fi
          if [ -f artifacts/nexus-ems-release.apk ]; then
            gh release upload android-latest artifacts/nexus-ems-release.apk --clobber
          fi
          if [ -f artifacts/nexus-ems-playstore.aab ]; then
            gh release upload android-latest artifacts/nexus-ems-playstore.aab --clobber
          fi

      - name: Publish Directly to Google Play Store (Internal Track)
        if: ${{ env.HAVE_PLAY_KEY == 'true' }}
        env:
          HAVE_PLAY_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nexus.ems
          releaseFiles: artifacts/nexus-ems-playstore.aab
          track: internal
          status: completed
